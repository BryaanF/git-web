name: Commit Standard & Checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  commit-standard:
    name: Validate 4-Type Commit Standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18'

      - name: Validate commits against 4-type standard
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/validate-commit-msg.ts --range "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            node scripts/validate-commit-msg.ts --range "$PUSH_BEFORE_SHA" "$PUSH_AFTER_SHA"
          fi

  verify:
    name: Typecheck, Build & Tests (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.18'
            run_perf: true
          - os: ubuntu-latest
            node: '24'
            run_perf: false
          - os: windows-latest
            node: '24'
            run_perf: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run typecheck && npm run build

      - name: Run unit & integration tests
        run: node --test --test-concurrency=1 tests/commit-standard.test.ts tests/diff-view.test.ts tests/fs-browse.test.ts tests/git-engine.test.ts tests/network.test.ts tests/pm2-autostart.test.ts tests/runner.test.ts

      - name: Run performance & bundle SLAs
        if: matrix.run_perf
        run: npm run test:perf
